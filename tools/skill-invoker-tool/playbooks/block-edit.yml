---
- name: Edit a managed block in a file
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  gather_facts: false
  become: "{{ use_become | default(false) }}"

  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - path is defined
          - path | length > 0
          - block is defined
        fail_msg: "Pass -e path=<file> -e block=<text-block>."

    - name: Ensure parent directory exists
      ansible.builtin.file:
        path: "{{ path | dirname }}"
        state: directory
        mode: "{{ dest_dir_mode | default('0755') }}"
      when:
        - create_parent | default(false) | bool

    - name: Edit block
      ansible.builtin.blockinfile:
        path: "{{ path }}"
        block: "{{ block }}"
        marker: "{{ marker | default('# {mark} ANSIBLE MANAGED BLOCK') }}"
        state: "{{ state | default('present') }}"
        create: "{{ create | default(false) }}"
        insertafter: "{{ insertafter | default(omit) }}"
        insertbefore: "{{ insertbefore | default(omit) }}"
        backup: "{{ backup | default(true) }}"
        owner: "{{ owner | default(omit) }}"
        group: "{{ group | default(omit) }}"
        mode: "{{ mode | default(omit) }}"
      register: block_result

    - name: Show block edit result
      ansible.builtin.debug:
        msg:
          changed: "{{ block_result.changed }}"
          backup_file: "{{ block_result.backup_file | default('') }}"
