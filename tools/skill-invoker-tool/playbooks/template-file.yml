---
- name: Render template to managed hosts
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  gather_facts: false
  become: "{{ use_become | default(false) }}"

  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - src is defined
          - src | length > 0
          - dest is defined
          - dest | length > 0
        fail_msg: "Pass -e src=<template-file.j2> -e dest=<remote-file>."

    - name: Create destination parent directory
      ansible.builtin.file:
        path: "{{ dest | dirname }}"
        state: directory
        mode: "{{ dest_dir_mode | default('0755') }}"
      when: create_parent | default(true) | bool

    - name: Render template
      ansible.builtin.template:
        src: "{{ src }}"
        dest: "{{ dest }}"
        owner: "{{ owner | default(omit) }}"
        group: "{{ group | default(omit) }}"
        mode: "{{ mode | default(omit) }}"
        backup: "{{ backup | default(true) }}"
      register: template_result

    - name: Show template result
      ansible.builtin.debug:
        msg:
          changed: "{{ template_result.changed }}"
          dest: "{{ template_result.dest | default(dest) }}"
          backup_file: "{{ template_result.backup_file | default('') }}"
